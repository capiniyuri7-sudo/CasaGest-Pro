plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace "br.com.casagestpro"
    compileSdk 35

    defaultConfig {
        applicationId "br.com.casagestpro"
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName "1.0"

        // Override with: ./gradlew assembleDebug -PCASA_GEST_URL=https://...
        buildConfigField "String", "CASA_GEST_URL", "\"${project.findProperty('CASA_GEST_URL') ?: 'https://casa-gest-pro-site.vercel.app/'}\""
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.15.0"
    implementation "androidx.activity:activity-ktx:1.10.0"
}